name: CI

# AgentEval (Category=AgentEval) skips without AGENT_EVAL_API_KEY/MODEL — not a PR gate.
# Real-uip smoke is .github/workflows/nightly-uip-smoke.yml (self-hosted); not used here.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore UiPath.Engineering.Mcp.sln

      - name: Format
        run: dotnet format UiPath.Engineering.Mcp.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test UiPath.Engineering.Mcp.sln --configuration Release --nologo --no-restore --logger trx --results-directory ${{ github.workspace }}/test-results

      - name: Golden eval
        run: dotnet test tests/UiPath.Engineering.Mcp.Tools.Tests/UiPath.Engineering.Mcp.Tools.Tests.csproj --configuration Release --nologo --no-restore --filter Category=GoldenEval --logger trx --results-directory ${{ github.workspace }}/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
